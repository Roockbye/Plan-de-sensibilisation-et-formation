version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependances:
        patterns: ['*']
    ignore:
      # @astrojs/check n'accepte pas encore TypeScript 7 : version majeure à réévaluer manuellement.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Les types Node suivent la version de Node utilisée (24 LTS, voir .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
